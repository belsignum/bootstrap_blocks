{namespace f=TYPO3\CMS\Fluid\ViewHelpers}
<div class="cb-preview cb-preview-teaser">
    <strong>Teaser:</strong>
    <f:if condition="{data.header}">
        <f:then>{data.header}</f:then>
        <f:else>(no header)</f:else>
    </f:if>

    <f:if condition="{data.belsignum_bb_teaser_layout}">
        · <code>{data.belsignum_bb_teaser_layout}</code>
    </f:if>

    <f:if condition="{data.frame_class}">
        · <code>{data.frame_class}</code>
    </f:if>

    <f:if condition="{data.belsignum_bb_cta_variant}">
        · <code>btn-{data.belsignum_bb_cta_variant}</code>
    </f:if>

    <f:if condition="{data.bb_icon_name}">
        · <i class="bi bi-{data.bb_icon_name}" aria-hidden="true"></i>
    </f:if>
</div>
