identifier: Belsignum/Media/Adjustments

fields:
  - identifier: palette_media_adjustments
    type: Palette
    label: Media Adjustments

    fields:
      - identifier: imageorient
        useExistingField: true

      - identifier: imagewidth
        useExistingField: true
        displayCond:
          AND:
            - 'FIELD:belsignum_bb_teaser_sprite:=:'
            - 'FIELD:layout:!=:no-image'

      - identifier: imageheight
        useExistingField: true
        displayCond:
          AND:
            - 'FIELD:belsignum_bb_teaser_sprite:=:'
            - 'FIELD:layout:!=:no-image'

  - identifier: image_zoom
    useExistingField: true


