<f:switch expression="{data.space_after_class}">
    <f:case value="extra-small">mb-1</f:case>
    <f:case value="small">mb-2</f:case>
    <f:case value="medium">mb-3</f:case>
    <f:case value="large">mb-4</f:case>
    <f:case value="extra-large">mb-5</f:case>
    <f:defaultCase></f:defaultCase>
</f:switch>
