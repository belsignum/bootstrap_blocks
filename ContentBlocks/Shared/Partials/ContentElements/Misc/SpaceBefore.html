<f:switch expression="{data.space_before_class}">
    <f:case value="extra-small">mt-1</f:case>
    <f:case value="small">mt-2</f:case>
    <f:case value="medium">mt-3</f:case>
    <f:case value="large">mt-4</f:case>
    <f:case value="extra-large">mt-5</f:case>
    <f:defaultCase></f:defaultCase>
</f:switch>
