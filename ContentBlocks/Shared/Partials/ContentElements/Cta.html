<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:bb="http://typo3.org/ns/Belsignum/BootstrapBlocks/ViewHelpers"
>
<f:if condition="{data.header_link}">
    <f:variable name="classes">
        bbb-cta btn
        <f:if condition="{data.belsignum_bb_cta_variant}">btn-{data.belsignum_bb_cta_variant}</f:if>
        <f:if condition="{data.belsignum_bb_cta_size} == 'sm'">btn-sm</f:if>
        <f:if condition="{data.belsignum_bb_cta_size} == lg">btn-lg</f:if>
        <f:if condition="{data.belsignum_bb_cta_block}">w-{data.belsignum_bb_cta_block}</f:if>
        <f:switch expression="{data.header_position}">
            <f:case value="left">me-auto</f:case>
            <f:case value="center">mx-auto</f:case>
            <f:case value="right">ms-auto</f:case>
            <f:defaultCase></f:defaultCase>
        </f:switch>
        <f:render partial="Misc/SpaceBefore" arguments="{data: data}" />
        <f:render partial="Misc/SpaceAfter" arguments="{data: data}" />
        <f:if condition="{data.belsignum_bb_icon_name}">bi bi-{data.belsignum_bb_icon_name}</f:if>
    </f:variable>

    <f:link.typolink parameter="{data.header_link}" class="{classes -> bb:cleanline()}"
                     additionalAttributes="{id: 'c{data.uid}'}">
        <f:if condition="{label}">
            <f:then>{label}</f:then>
            <f:else>CTA</f:else>
        </f:if>
    </f:link.typolink>
</f:if>

</html>
